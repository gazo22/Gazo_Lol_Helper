name: Installeur Windows

# Produit RiftLens-Setup.exe (WebView2 + SQL Server Express + application + service local).
# Manuel (onglet Actions), à chaque push sur main / branches de travail, ou sur un tag vX.Y.Z
# (qui publie aussi une Release GitHub).
on:
  workflow_dispatch:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.${{ github.run_number }}" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: dotnet test RiftLens.sln -c Release

      - name: Publish (self-contained win-x64)
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          dotnet publish src/RiftLens.Desktop/RiftLens.Desktop.csproj -c Release -r win-x64 --self-contained -p:Version=$v -o artifacts/app
          dotnet publish src/RiftLens.Api/RiftLens.Api.csproj -c Release -r win-x64 --self-contained -p:Version=$v -o artifacts/server

      - name: Programmes d'installation Microsoft
        shell: pwsh
        run: |
          $redist = "installer/Bundle/redist"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$redist/MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?linkid=2216019" -OutFile "$env:RUNNER_TEMP/SQL2022-SSEI-Expr.exe"
          # Le bootstrapper SSEI ne sert qu'à télécharger le média complet, embarqué ensuite dans l'installeur.
          $media = "$env:RUNNER_TEMP/sqlmedia"
          $p = Start-Process "$env:RUNNER_TEMP/SQL2022-SSEI-Expr.exe" -ArgumentList "/ACTION=Download", "/MEDIAPATH=$media", "/MEDIATYPE=Core", "/LANGUAGE=en-US", "/QUIET" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Téléchargement de SQL Server Express : code $($p.ExitCode)" }
          $exe = Get-ChildItem $media -Filter "SQLEXPR*_x64_ENU.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { Get-ChildItem $media -Recurse | Format-Table FullName, Length; throw "SQLEXPR_x64_ENU.exe introuvable" }
          Copy-Item $exe.FullName "$redist/SQLEXPR_x64_ENU.exe"
          Get-ChildItem $redist | Format-Table Name, Length

      - name: Build installeur (WiX)
        run: dotnet build installer/Bundle/RiftLens.Bundle.wixproj -c Release -p:Version=${{ steps.version.outputs.value }}

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: RiftLens-Setup-${{ steps.version.outputs.value }}
          path: installer/Bundle/bin/x64/Release/RiftLens-Setup.exe

      - name: Release GitHub
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Bundle/bin/x64/Release/RiftLens-Setup.exe
          generate_release_notes: true
