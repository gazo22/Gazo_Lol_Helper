name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (warnings = erreurs, WPF compilé via EnableWindowsTargeting)
        run: dotnet build RiftLens.sln -c Release
      - name: Tests
        run: dotnet test RiftLens.sln -c Release --no-build
