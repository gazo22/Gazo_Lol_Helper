# Usage : copier .env.example en .env, renseigner les secrets, puis `docker compose up -d --build`.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?SQL_SA_PASSWORD manquant dans .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/RiftLens.Api/Dockerfile
      args:
        PROJECT: RiftLens.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__RiftLens: "Server=sqlserver,1433;Database=RiftLens;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"
      Riot__ApiKey: ${RIOT_API_KEY:?RIOT_API_KEY manquant dans .env}
      Access__Keys__0: ${RIFTLENS_ACCESS_KEY:?RIFTLENS_ACCESS_KEY manquant dans .env}
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  collector:
    build:
      context: .
      dockerfile: src/RiftLens.Api/Dockerfile
      args:
        PROJECT: RiftLens.Collector
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__RiftLens: "Server=sqlserver,1433;Database=RiftLens;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True"
      Riot__ApiKey: ${RIOT_API_KEY}
    depends_on:
      api:
        condition: service_started

volumes:
  sqldata:
