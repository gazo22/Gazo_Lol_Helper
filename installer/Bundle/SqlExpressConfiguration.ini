; Installation silencieuse de SQL Server 2022 Express pour RiftLens.
; Instance dédiée, accès local uniquement (TCP désactivé), le service RiftLens (SYSTEM) est administrateur.
[OPTIONS]
ACTION="Install"
FEATURES=SQLENGINE
INSTANCENAME="RIFTLENS"
INSTANCEID="RIFTLENS"
SQLSYSADMINACCOUNTS="NT AUTHORITY\SYSTEM" "BUILTIN\Administrators"
ADDCURRENTUSERASSQLADMIN="False"
TCPENABLED="0"
NPENABLED="0"
SQLSVCSTARTUPTYPE="Automatic"
BROWSERSVCSTARTUPTYPE="Disabled"
UPDATEENABLED="False"
QUIET="True"
IACCEPTSQLSERVERLICENSETERMS="True"
SUPPRESSPRIVACYSTATEMENTNOTICE="True"
